<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Чистый белый фон со скруглением под иконку -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <!-- Лаймовый бегущий человек в минимализме -->
  <g fill="#A3E635">
    <!-- Голова -->
    <circle cx="280" cy="90" r="30" />
    <!-- Тело и конечности (динамичная поза бега) -->
    <path d="M320 150 l-50 30 v70 l60 70 l-25 20 l-65 -75 v-60 l-50 30 l-20 -40 l80 -50 z" />
    <!-- Опорная нога -->
    <path d="M270 250 l-30 80 l-60 10 l10 -30 l40 -10 l25 -60 z" />
  </g>
</svg>
