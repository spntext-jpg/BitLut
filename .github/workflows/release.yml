name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example: 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      RELEASE_TAG: v${{ github.event.inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        run: |
          mkdir -p .signing
          echo "${{ secrets.BITLUT_KEYSTORE_BASE64 }}" | base64 -d > .signing/bitlut-release.jks

      - name: Restore agconnect-services.json
        run: |
          echo "${{ secrets.AGCONNECT_SERVICES_JSON_BASE64 }}" | base64 -d > app/agconnect-services.json

      - name: Build release APK
        env:
          BITLUT_KEYSTORE_PASSWORD: ${{ secrets.BITLUT_KEYSTORE_PASSWORD }}
          BITLUT_KEY_ALIAS: ${{ secrets.BITLUT_KEY_ALIAS }}
          BITLUT_KEY_PASSWORD: ${{ secrets.BITLUT_KEY_PASSWORD }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          echo "Available APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_PATH="$(find app/build/outputs/apk/release -type f -name "*release*.apk" ! -name "*androidTest*" ! -name "*unsigned*" | head -1)"

          if [ -z "$APK_PATH" ]; then
            echo "No signed release APK found"
            exit 1
          fi

          echo "Selected APK: $APK_PATH"
          file "$APK_PATH"
          unzip -t "$APK_PATH"

          cp "$APK_PATH" "release/BitLut-${RELEASE_TAG}.apk"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitLut-${{ env.RELEASE_TAG }}
          path: release/*.apk

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BitLut ${{ env.RELEASE_TAG }}
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
