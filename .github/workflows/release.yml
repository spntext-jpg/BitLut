name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example: 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      RELEASE_TAG: v${{ github.event.inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36.1 build-tools;35.0.0"

      - name: Restore release keystore
        run: |
          mkdir -p .signing
          echo "${{ secrets.BITLUT_KEYSTORE_BASE64 }}" | base64 -d > .signing/bitlut-release.jks

      - name: Restore agconnect-services.json
        run: |
          echo "${{ secrets.AGCONNECT_SERVICES_JSON_BASE64 }}" | base64 -d > app/agconnect-services.json

      - name: Compute version code
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION → versionCode: $VERSION_CODE"

      - name: Verify Android dependency compatibility
        run: |
          chmod +x ./gradlew
          ./gradlew :app:checkReleaseAarMetadata --stacktrace

      - name: Lint release
        run: |
          ./gradlew :app:lintRelease --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BitLut-${{ env.RELEASE_TAG }}-lint
          path: |
            app/build/reports/lint-results-release.html
            app/build/intermediates/lint_intermediate_text_report/release/**/lint-results-release.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build release APK
        env:
          BITLUT_KEYSTORE_PASSWORD: ${{ secrets.BITLUT_KEYSTORE_PASSWORD }}
          BITLUT_KEY_ALIAS: ${{ secrets.BITLUT_KEY_ALIAS }}
          BITLUT_KEY_PASSWORD: ${{ secrets.BITLUT_KEY_PASSWORD }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare signed APK
        env:
          BITLUT_KEYSTORE_PASSWORD: ${{ secrets.BITLUT_KEYSTORE_PASSWORD }}
          BITLUT_KEY_ALIAS: ${{ secrets.BITLUT_KEY_ALIAS }}
          BITLUT_KEY_PASSWORD: ${{ secrets.BITLUT_KEY_PASSWORD }}
        run: |
          mkdir -p release
          echo "Available APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          UNSIGNED_APK="$(find app/build/outputs/apk/release -type f -name "*unsigned*.apk" | head -1)"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "No unsigned release APK found"
            exit 1
          fi

          echo "Unsigned APK: $UNSIGNED_APK"

          ZIPALIGNED_APK="release/BitLut-${RELEASE_TAG}-aligned.apk"
          SIGNED_APK="release/BitLut-${RELEASE_TAG}.apk"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"

          echo "zipalign: $ZIPALIGN"
          echo "apksigner: $APKSIGNER"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$ZIPALIGNED_APK"

          "$APKSIGNER" sign             --ks .signing/bitlut-release.jks             --ks-key-alias "$BITLUT_KEY_ALIAS"             --ks-pass "pass:$BITLUT_KEYSTORE_PASSWORD"             --key-pass "pass:$BITLUT_KEY_PASSWORD"             --out "$SIGNED_APK"             "$ZIPALIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          unzip -t "$SIGNED_APK"

          rm -f "$ZIPALIGNED_APK"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: BitLut-${{ env.RELEASE_TAG }}
          path: release/*.apk
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BitLut ${{ env.RELEASE_TAG }}
          files: release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
