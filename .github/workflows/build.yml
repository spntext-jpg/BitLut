name: Android Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        default: "1.0.0"

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore release keystore
        run: |
          mkdir -p .signing
          echo "${{ secrets.BITLUT_KEYSTORE_BASE64 }}" | base64 -d > .signing/bitlut-release.jks

      - name: Create local Huawei env
        run: |
          cat > .huawei.env <<EOF
          HUAWEI_APP_ID=${{ secrets.HUAWEI_APP_ID }}
          EOF

      - name: Build release APK
        env:
          BITLUT_KEYSTORE_PATH: .signing/bitlut-release.jks
          BITLUT_KEYSTORE_PASSWORD: ${{ secrets.BITLUT_KEYSTORE_PASSWORD }}
          BITLUT_KEY_ALIAS: ${{ secrets.BITLUT_KEY_ALIAS }}
          BITLUT_KEY_PASSWORD: ${{ secrets.BITLUT_KEY_PASSWORD }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:clean :app:assembleRelease --stacktrace 2>&1 | tee build.log
          echo "APK outputs:"
          find app/build/outputs -type f | sort

      - name: Verify release APK exists
        run: |
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          mkdir -p release-artifacts
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          cp "$APK_PATH" "release-artifacts/BitLut-${{ github.event.inputs.version_name }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BitLut-${{ github.event.inputs.version_name }}-release-apk
          path: release-artifacts/*.apk
          if-no-files-found: error


      - name: Build failure summary
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo ""
            echo "### Quick diagnosis"
            echo "- Check the first Gradle error above this summary."
            echo "- Check Java version, signing secrets, and APK output path."
            echo "- For signing errors, verify BITLUT_KEYSTORE_BASE64, BITLUT_KEYSTORE_PASSWORD, BITLUT_KEY_ALIAS, BITLUT_KEY_PASSWORD."
            echo ""
            echo "### Java"
            echo '```'
            java -version 2>&1 || true
            echo '```'
            echo ""
            echo "### Outputs"
            echo '```'
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
