name: Build BitLut APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Huawei credentials from GitHub Secrets
        run: |
          echo "HUAWEI_CLIENT_ID=${{ secrets.HUAWEI_CLIENT_ID }}" >> local.properties
          echo "HUAWEI_CLIENT_SECRET=${{ secrets.HUAWEI_CLIENT_SECRET }}" >> local.properties

      - name: Build APK
        id: build
        run: |
          TASK="assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }}"
          ./gradlew $TASK --stacktrace 2>&1 | tee build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Full error summary on failure
        if: failure()
        run: |
          echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Kotlin errors:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: " build_output.txt \
            | sed 's|/home/runner/work/BitLut/BitLut/||' \
            >> $GITHUB_STEP_SUMMARY || echo "none" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### AAPT/Resource errors:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error: |AAPT:" build_output.txt \
            | sed 's|/home/runner/work/BitLut/BitLut/||' \
            >> $GITHUB_STEP_SUMMARY || echo "none" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Failed tasks:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep "> Task .* FAILED" build_output.txt \
            >> $GITHUB_STEP_SUMMARY || echo "none" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Root cause (What went wrong):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 10 "What went wrong:" build_output.txt \
            | head -30 >> $GITHUB_STEP_SUMMARY || echo "none" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Last 50 lines of build output:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 build_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.txt
          retention-days: 7

      - name: Upload Debug APK
        if: success() && github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: BitLut-debug
          path: app/build/outputs/apk/debug/**.apk
          retention-days: 14

      - name: Upload Release APK
        if: success() && github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: BitLut-release
          path: app/build/outputs/apk/release/**.apk
          retention-days: 14
