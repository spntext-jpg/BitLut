name: Build BitLut Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore from GitHub Secrets
        env:
          BITLUT_KEYSTORE_BASE64: ${{ secrets.BITLUT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BITLUT_KEYSTORE_BASE64" ]; then
            echo "BITLUT_KEYSTORE_BASE64 secret is required for production release builds." >&2
            exit 1
          fi
          echo "$BITLUT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bitlut-release.jks"

      - name: Write local release properties
        run: |
          cat > local.properties <<EOF
          BITLUT_KEYSTORE_PATH=$RUNNER_TEMP/bitlut-release.jks
          BITLUT_KEYSTORE_PASSWORD=${{ secrets.BITLUT_KEYSTORE_PASSWORD }}
          BITLUT_KEY_ALIAS=${{ secrets.BITLUT_KEY_ALIAS }}
          BITLUT_KEY_PASSWORD=${{ secrets.BITLUT_KEY_PASSWORD }}
          HUAWEI_APP_ID=${{ secrets.HUAWEI_APP_ID }}
          HUAWEI_CLIENT_ID=${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET=${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_REDIRECT_URI=${{ secrets.HUAWEI_REDIRECT_URI }}
          EOF

      - name: Validate production package and version
        run: |
          grep -q 'applicationId = "com.openhealth.sync"' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts
          ! grep -R 'applicationIdSuffix' app/build.gradle.kts
          test -n "${{ secrets.HUAWEI_APP_ID }}"

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:clean :app:assembleRelease --stacktrace 2>&1 | tee build_output.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BitLut-1.0.0-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build failure summary
        if: failure()
        run: |
          echo "## Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -120 build_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
